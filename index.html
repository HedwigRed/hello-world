<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广告投放词筛选</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .fade-in { animation: fadeIn 0.35s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-50 via-white to-blue-50/30 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import { GoogleGenAI } from 'https://esm.sh/@google/genai';

      const { useMemo, useState, useEffect } = React;

      const STEPS = ['产品分析', '竞品评论', '产品定位', '词库导入', 'ABA 匹配', '漏斗筛选'];

      function parseASIN(input) {
        const trimmed = input.trim();
        const urlMatch = trimmed.match(/\/dp\/([A-Z0-9]{10})/i);
        if (urlMatch) return urlMatch[1].toUpperCase();
        const asinMatch = trimmed.match(/^[A-Z0-9]{10}$/i);
        if (asinMatch) return asinMatch[0].toUpperCase();
        return null;
      }

      const badgeBySFR = (sfr) => {
        if (!sfr || Number(sfr) === 0) return ['未知', 'bg-slate-100 text-slate-500'];
        const n = Number(sfr);
        if (n < 5000) return ['大词', 'bg-red-50 text-red-700'];
        if (n <= 30000) return ['中词', 'bg-amber-50 text-amber-700'];
        return ['长尾词', 'bg-emerald-50 text-emerald-700'];
      };

      const parseCSVWithMapping = (text, map) => {
        const result = Papa.parse(text, { header: true, skipEmptyLines: true });
        const fields = result.meta.fields || [];
        const findCol = (candidates) => fields.find((f) => candidates.some((c) => f?.toLowerCase().trim() === c.toLowerCase().trim()));
        const cols = Object.fromEntries(Object.entries(map).map(([k, v]) => [k, findCol(v)]));
        return result.data.map((row, idx) => ({
          id: idx + 1,
          keyword: row[cols.keyword] || row[fields[0]] || '',
          searchVolume: Number((row[cols.searchVolume] || '').toString().replace(/,/g, '')) || 0,
          sfr: Number((row[cols.sfr] || '').toString().replace(/,/g, '')) || 0,
          cpc: Number((row[cols.cpc] || '').toString().replace(/[^\d.]/g, '')) || 0,
        })).filter((x) => x.keyword);
      };

      const splitWords = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);

      function Stepper({ step }) {
        return (
          <div className="flex items-center gap-2 overflow-x-auto py-2">
            {STEPS.map((name, i) => (
              <React.Fragment key={name}>
                <div className="flex items-center gap-2 shrink-0">
                  <span className={`w-7 h-7 rounded-full text-xs font-bold flex items-center justify-center ${i < step ? 'bg-emerald-500 text-white' : i === step ? 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white' : 'bg-slate-200 text-slate-500'}`}>
                    {i < step ? '✓' : i + 1}
                  </span>
                  <span className={`text-xs ${i <= step ? 'text-slate-700' : 'text-slate-400'}`}>{name}</span>
                </div>
                {i < STEPS.length - 1 && <div className="w-6 h-px bg-slate-300" />}
              </React.Fragment>
            ))}
          </div>
        );
      }

      function ProductAnalysis({ productData, setProductData, setPositioning, setKeywords }) {
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);
        const [message, setMessage] = useState('');
        const parsedAsin = useMemo(() => parseASIN(input), [input]);

        const fallbackData = (asin) => ({
          asin,
          title: 'Retinol Night Cream for Face with Hyaluronic Acid & Peptides - Anti Aging Moisturizer',
          brand: 'DermGlow',
          price: '$29.99',
          rating: '4.6',
          reviews: '12450',
          category: 'Beauty & Personal Care > Skin Care > Face > Creams & Moisturizers > Night Creams',
          bulletPoints: [
            'Retinol + Peptide formula helps visibly reduce fine lines and wrinkles.',
            'Deep hydration with hyaluronic acid supports smoother, plumper skin overnight.',
            'Fragrance-free, non-greasy texture suitable for sensitive skin types.',
            'Dermatologist-tested and cruelty-free with clean ingredient standards.',
            'Visible skin texture improvement in as little as 2 weeks with nightly use.',
          ],
          ingredients: 'Retinol, Hyaluronic Acid, Peptides, Niacinamide, Ceramides, Vitamin E',
          suggestedKeywords: ['retinol night cream', 'anti aging moisturizer', 'face cream for wrinkles', 'hyaluronic acid moisturizer', 'firming night cream', 'sensitive skin retinol', 'peptide face cream', 'hydrating anti wrinkle cream'],
          suggestedPositioning: {
            categoryWords: 'retinol night cream, anti aging face moisturizer, wrinkle cream',
            sellingPoints: 'retinol + peptide synergy, non-greasy hydration, fragrance-free formula',
            targetAudience: 'women over 30, sensitive skin users, anti-aging seekers',
            useScenarios: 'night skincare routine, under overnight mask, winter dry skin care',
          },
        });

        const handleAnalyze = async () => {
          if (!parsedAsin || loading) return;
          setLoading(true);
          setMessage('');
          const prompt = `你是亚马逊产品数据提取专家。请使用 Google Search 工具搜索以下 ASIN 在 Amazon.com 上的产品信息。\n\nASIN: ${parsedAsin}\n\n搜索策略（请按顺序执行，确保数据准确）：\n\n1. 搜索 "amazon.com dp/${parsedAsin}" 找到该产品的 Amazon Listing 页面\n2. 重点提取【当前实际成交价格】，注意区分：\n   - ✅ 要提取的：页面上最大字号显示的 "Price: $XX.XX" 或 "Deal Price" 或 "Sale Price" —— 这才是买家实际支付的价格\n   - ❌ 不要提取：带删除线的 "List Price: $XX.XX" 或 "Was: $XX.XX" —— 这是划线价/原价，不是成交价\n   - 如果有 Subscribe & Save 价格，取普通购买价格（One-time purchase price），不取订阅价\n3. 评分和评论数必须提取真实数值：\n   - Rating：如 "4.6 out of 5 stars"，提取 "4.6"\n   - Reviews：如 "12,450 ratings"，提取 "12450"（纯数字，去掉逗号）\n4. 五点描述（Bullet Points）：必须提取 Listing 页面 "About this item" 部分的【全部】bullet points（通常 5-7 条），每条完整提取，不要缩写或概括\n5. 核心成分/关键卖点（ingredients）：\n   - 如果是护肤品/食品等，从五点描述和产品描述中提取所有提到的活性成分，用逗号分隔\n   - 如果是非成分类产品（如电子产品、家居），则提取核心功能卖点关键词\n   - 尽量全面，不要遗漏\n6. 品类路径：提取完整的 breadcrumb 路径，如 "Beauty & Personal Care > Skin Care > Face > Creams & Moisturizers > Night Creams"\n\n请严格按以下 JSON 格式返回，不要添加任何额外文字：\n\n{\n  "asin": "${parsedAsin}",\n  "title": "完整的产品标题",\n  "brand": "品牌名",\n  "price": "当前实际成交价格，格式如 $29.99",\n  "rating": "评分数字，如 4.6",\n  "reviews": "评论数量，纯数字如 12450",\n  "category": "完整品类路径，用 > 分隔",\n  "bulletPoints": [\n    "第一条完整的 bullet point 原文",\n    "第二条完整的 bullet point 原文",\n    "第三条完整的 bullet point 原文",\n    "第四条完整的 bullet point 原文",\n    "第五条完整的 bullet point 原文"\n  ],\n  "ingredients": "成分1, 成分2, 成分3, ...",\n  "suggestedKeywords": ["关键词1", "关键词2", "...(生成8-12个与该产品高度相关的亚马逊搜索关键词)"],\n  "suggestedPositioning": {\n    "categoryWords": "该品类的核心搜索词，逗号分隔",\n    "sellingPoints": "该产品的差异化卖点/核心成分，逗号分隔",\n    "targetAudience": "目标人群描述，逗号分隔",\n    "useScenarios": "使用场景，逗号分隔"\n  }\n}\n\n注意事项：\n- price 字段必须是买家实际支付的价格，不是划线价/原价\n- bulletPoints 数组中每条必须是 Listing 原文，不是你的概括或翻译\n- ingredients 要尽量完整，从 bulletPoints + product description + product details 三个区域综合提取\n- 如果某个字段确实无法获取，填空字符串 ""，不要编造数据`;

          try {
            const apiKey = window.GEMINI_API_KEY || '';
            if (!apiKey) throw new Error('Missing GEMINI_API_KEY');
            const ai = new GoogleGenAI({ apiKey });
            const response = await ai.models.generateContent({
              model: 'gemini-2.0-flash',
              contents: prompt,
              tools: [{ googleSearch: {} }],
            });
            const text = response.text || '{}';
            const parsed = JSON.parse(text.match(/\{[\s\S]*\}/)?.[0] || '{}');
            const finalData = { ...fallbackData(parsedAsin), ...parsed, asin: parsedAsin };
            setProductData(finalData);
            setPositioning(finalData.suggestedPositioning || {});
            setKeywords((prev) => [...prev, ...((finalData.suggestedKeywords || []).map((k, i) => ({ id: Date.now() + i, keyword: k, searchVolume: 0, sfr: 0, cpc: 0 }))) ]);
            setMessage('AI 检索成功');
          } catch (e) {
            const mock = fallbackData(parsedAsin);
            setProductData(mock);
            setPositioning(mock.suggestedPositioning || {});
            setKeywords((prev) => [...prev, ...mock.suggestedKeywords.map((k, i) => ({ id: Date.now() + i, keyword: k, searchVolume: 0, sfr: 0, cpc: 0 }))]);
            setMessage('ℹ️ AI 检索失败，已使用示例数据。请核实产品信息是否准确');
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="space-y-4 fade-in">
            <div className="flex gap-2">
              <input className="h-12 flex-1 border border-slate-200 rounded-xl px-4 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="粘贴亚马逊产品链接，如 https://www.amazon.com/dp/B0XXXXXXXX" value={input} onChange={(e) => setInput(e.target.value)} />
              <button className="px-4 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 text-white disabled:opacity-50" onClick={handleAnalyze} disabled={!parsedAsin || loading}>{loading ? '分析中...' : '🔍 AI 分析'}</button>
            </div>
            <div className={`text-sm ${parsedAsin ? 'text-emerald-600' : input ? 'text-red-500' : 'text-slate-400'}`}>
              {parsedAsin ? `✓ 已识别 ASIN: ${parsedAsin}` : input ? '无法识别 ASIN' : '请输入链接或 ASIN'}
            </div>
            {loading && <div className="text-blue-600 text-sm">⏳ 正在通过 AI 检索产品信息...</div>}
            {message && <div className={`text-sm ${message.startsWith('ℹ️') ? 'text-amber-600' : 'text-emerald-600'}`}>{message}</div>}

            {productData && (
              <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl border border-blue-100 p-4 space-y-3">
                <div className="flex justify-between items-start gap-4">
                  <div className="space-y-1">
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">ASIN: {productData.asin}</span>
                    <div className="text-sm text-slate-500">品牌：{productData.brand || '-'}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-2xl font-bold text-blue-600">{productData.price || '-'}</div>
                    <div className="text-sm text-slate-600">⭐ {productData.rating || '-'} · {productData.reviews || '-'} reviews</div>
                  </div>
                </div>
                <h3 className="text-lg font-semibold text-slate-800">{productData.title}</h3>
                <p className="text-xs text-slate-400">📂 {productData.category}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <ul className="list-disc pl-5 text-xs text-slate-600 space-y-1">{(productData.bulletPoints || []).map((b, i) => <li key={i}>{b}</li>)}</ul>
                  <div className="space-y-3">
                    <div>
                      <div className="text-xs font-semibold mb-1">核心成分</div>
                      <div className="flex flex-wrap gap-1.5">{splitWords(productData.ingredients || '').map((w) => <span key={w} className="px-2.5 py-0.5 rounded-full text-xs font-medium bg-violet-50 text-violet-700 ring-1 ring-violet-200">{w}</span>)}</div>
                    </div>
                    <div>
                      <div className="text-xs font-semibold mb-1">AI 建议关键词</div>
                      <div className="flex flex-wrap gap-1.5">{(productData.suggestedKeywords || []).map((w) => <span key={w} className="px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200">{w}</span>)}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function CompetitorReviews({ setReviewInsights, reviewInsights }) {
        const [asinText, setAsinText] = useState('');
        const [analyzing, setAnalyzing] = useState(false);
        const [selected, setSelected] = useState([]);
        const parseAsins = (txt) => [...new Set(txt.split(/[\n,]/).map((x) => x.trim().toUpperCase()).filter((x) => /^[A-Z0-9]{10}$/.test(x)).slice(0,5))];
        const run = () => {
          setAnalyzing(true);
          setTimeout(() => {
            // TODO: 替换为真实 API
            const data = {
              competitorAsins: parseAsins(asinText),
              totalReviewsAnalyzed: 1680,
              painPoints: [{text:'too greasy for daytime',frequency:'high',sentiment:'negative'},{text:'strong fragrance',frequency:'medium',sentiment:'negative'}],
              praisedFeatures:[{text:'lightweight hydration',frequency:'high',sentiment:'positive'},{text:'no irritation on sensitive skin',frequency:'high',sentiment:'positive'}],
              realScenarios:['night cream routine','under makeup in winter','post-retinol soothing'],
              buyerProfiles:['mature skin over 40','sensitive skin','dry combination skin'],
              reviewKeywords:[{word:'moisturizing',count:47},{word:'anti aging',count:35},{word:'non greasy',count:31},{word:'sensitive skin',count:28}],
              decisionFactors:['price worth it','visible results in 2 weeks','texture and absorption speed'],
              suggestedKeywordsFromReviews:['non greasy night cream','retinol cream for sensitive skin','anti aging cream under makeup','hydrating peptide cream'],
              positioningEnhancements:{additionalSellingPoints:['fast absorption','no pilling under makeup'],additionalAudience:['first-time retinol users'],additionalScenarios:['winter night routine','after exfoliation recovery']}
            };
            setReviewInsights(data);
            setSelected(data.suggestedKeywordsFromReviews);
            setAnalyzing(false);
          }, 3000);
        };
        return <div className="space-y-4 fade-in">
          <textarea className="w-full border border-slate-200 rounded-xl p-3 h-24" placeholder="输入1-5个竞品ASIN，每行一个或逗号分隔" value={asinText} onChange={(e)=>setAsinText(e.target.value)} />
          <button className="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 text-white" onClick={run}>{analyzing?'抓取中...':'抓取评论'}</button>
          {reviewInsights && <>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {[['🔥 高频痛点',reviewInsights.painPoints.map(x=>x.text),'bg-red-50 text-red-700'],['⭐ 核心好评点',reviewInsights.praisedFeatures.map(x=>x.text),'bg-emerald-50 text-emerald-700'],['🎯 真实场景',reviewInsights.realScenarios,'bg-blue-50 text-blue-700'],['👤 买家画像',reviewInsights.buyerProfiles,'bg-violet-50 text-violet-700'],['🔑 高频关键词',reviewInsights.reviewKeywords.map(x=>`${x.word} (${x.count})`),'bg-slate-100 text-slate-700'],['💰 决策因素',reviewInsights.decisionFactors,'bg-amber-50 text-amber-700']].map(([title,arr,cls])=><div key={title} className="border border-slate-200 rounded-xl p-3"><div className="font-semibold text-sm mb-2">{title}</div><div className="flex flex-wrap gap-1.5">{arr.map(v=><span key={v} className={`px-2.5 py-0.5 rounded-full text-xs font-medium ${cls}`}>{v}</span>)}</div></div>)}
            </div>
            <div className="border border-slate-200 rounded-xl p-3">
              <div className="font-semibold text-sm mb-2">AI 推荐新种子关键词</div>
              <div className="flex flex-wrap gap-2">{reviewInsights.suggestedKeywordsFromReviews.map(w=><label key={w} className="text-xs"><input type="checkbox" checked={selected.includes(w)} onChange={()=>setSelected(s=>s.includes(w)?s.filter(x=>x!==w):[...s,w])}/> {w}</label>)}</div>
            </div>
          </>}
        </div>
      }

      function ProductPositioning({ productData, positioning, setPositioning, stage, setStage, reviewInsights }) {
        useEffect(() => {
          if (productData?.suggestedPositioning && !Object.values(positioning || {}).some(Boolean)) {
            setPositioning(productData.suggestedPositioning);
          }
        }, [productData]);
        const update = (k, v) => setPositioning((p) => ({ ...p, [k]: v }));
        return <div className="space-y-3 fade-in">
          {reviewInsights && <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm">定位增强建议：{reviewInsights.positioningEnhancements.additionalSellingPoints.join('，')}</div>}
          {['categoryWords','sellingPoints','targetAudience','useScenarios'].map((k)=><textarea key={k} className="w-full border border-slate-200 rounded-xl p-3 h-20" placeholder={k} value={positioning[k]||''} onChange={(e)=>update(k,e.target.value)} />)}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">{[['cold_start','🟢 冷启动期'],['growth','🔵 成长期'],['mature','🟣 成熟期'],['decline','🔴 衰退期']].map(([k,l])=><button key={k} onClick={()=>setStage(k)} className={`px-2 py-2 rounded-xl border ${stage===k?'bg-blue-50 border-blue-300 text-blue-700':'border-slate-200 text-slate-600'}`}>{l}</button>)}</div>
        </div>
      }

      function KeywordImport({ keywords, setKeywords, reviewInsights }) {
        const [mode, setMode] = useState('csv');
        const [manual, setManual] = useState('');
        const [selected, setSelected] = useState([]);
        useEffect(()=>{ if(reviewInsights) setSelected(reviewInsights.suggestedKeywordsFromReviews||[]); },[reviewInsights]);
        const onFile = (file) => {
          const reader = new FileReader();
          reader.onload = () => {
            const rows = parseCSVWithMapping(reader.result, {
              keyword: ['关键词', 'Keyword', 'keyword', 'Search Term', 'search_term'],
              searchVolume: ['搜索量', 'Search Volume', 'search_volume', '月搜索量'],
              sfr: ['SFR', '搜索频率排名', 'Search Frequency Rank'],
              cpc: ['CPC', '竞价', 'Bid'],
            });
            setKeywords(rows.slice(0, 500));
          };
          reader.readAsText(file, 'utf-8');
        };
        const importManual = () => {
          const rows = manual.split('\n').map((line, i) => {
            const [keyword, sv, sfr, cpc] = line.split(/[\t,]/).map((x) => x.trim());
            return { id: i + 1, keyword, searchVolume: Number(sv)||0, sfr: Number(sfr)||0, cpc: Number(cpc)||0 };
          }).filter((x) => x.keyword);
          setKeywords(rows);
        };
        return <div className="space-y-3 fade-in">
          <div className="flex gap-2"><button onClick={()=>setMode('csv')} className={`px-3 py-1 rounded-xl ${mode==='csv'?'bg-blue-100 text-blue-700':'bg-white border border-slate-200'}`}>CSV 上传</button><button onClick={()=>setMode('manual')} className={`px-3 py-1 rounded-xl ${mode==='manual'?'bg-blue-100 text-blue-700':'bg-white border border-slate-200'}`}>手动粘贴</button></div>
          {reviewInsights && <div className="border border-slate-200 rounded-xl p-3"><div className="text-sm font-semibold mb-2">📝 评论洞察推荐词</div><div className="flex flex-wrap gap-1.5">{reviewInsights.suggestedKeywordsFromReviews.map(w=><button key={w} className={`px-2.5 py-0.5 rounded-full text-xs ${selected.includes(w)?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-600'}`} onClick={()=>setSelected(s=>s.includes(w)?s.filter(x=>x!==w):[...s,w])}>{w}</button>)}</div><button className="mt-2 px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs" onClick={()=>setKeywords(prev=>[...prev,...selected.map((w,i)=>({id:Date.now()+i,keyword:w,searchVolume:0,sfr:0,cpc:0}))])}>添加到词库</button></div>}
          {mode==='csv'?<div className="border-2 border-dashed border-slate-200 rounded-xl p-6"><input type="file" accept=".csv" onChange={(e)=>e.target.files[0]&&onFile(e.target.files[0])} /></div>:<div><textarea className="w-full h-24 border border-slate-200 rounded-xl p-3" value={manual} onChange={(e)=>setManual(e.target.value)} /><button className="mt-2 px-3 py-1 bg-blue-600 text-white rounded-lg" onClick={importManual}>导入</button></div>}
          <div className="rounded-xl overflow-hidden border border-slate-200 max-h-80 overflow-y-auto"><table className="w-full text-sm"><thead className="sticky top-0 bg-slate-50"><tr><th>#</th><th>关键词</th><th>搜索量</th><th>SFR</th><th>CPC</th></tr></thead><tbody>{keywords.slice(0,100).map((k,i)=>{const [label,cls]=badgeBySFR(k.sfr);return <tr key={k.id||i} className="border-t"><td>{i+1}</td><td>{k.keyword}</td><td>{k.searchVolume}</td><td><span className={`px-2 py-0.5 rounded-full text-xs ${cls}`}>{k.sfr||0} {label}</span></td><td>{k.cpc||0}</td></tr>})}</tbody></table></div>
        </div>
      }

      function ABAMatching({ keywords, setKeywords }) {
        const matchMock = () => {
          const updated = keywords.map((k) => ({ ...k, sfr: Math.floor(Math.random() * 149000) + 1000, clickShare1: +(Math.random()*40+5).toFixed(2), convShare1:+(Math.random()*35+3).toFixed(2) }));
          setKeywords(updated);
        };
        return <div className="space-y-3 fade-in"><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><div className="border border-slate-200 rounded-xl p-4">上传 ABA 报告 CSV</div><div className="border border-slate-200 rounded-xl p-4"><button className="px-3 py-2 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 text-white" onClick={matchMock}>模拟 ABA 数据</button></div></div><div className="rounded-xl overflow-hidden border border-slate-200 max-h-80 overflow-y-auto"><table className="w-full text-sm"><thead className="sticky top-0 bg-slate-50"><tr><th>关键词</th><th>SFR</th><th>点击份额Top1</th><th>转化份额Top1</th></tr></thead><tbody>{keywords.slice(0,100).map((k,i)=><tr key={i} className="border-t"><td>{k.keyword}</td><td>{k.sfr||0}</td><td className={(k.clickShare1||0)>40?'text-red-600 font-semibold':''}>{k.clickShare1||0}%</td><td>{k.convShare1||0}%</td></tr>)}</tbody></table></div></div>
      }

      function FunnelFilter({ keywords, positioning, stage }) {
        const [view, setView] = useState('config');
        const [irrelevantTerms, setIrrelevantTerms] = useState('body lotion, shampoo, sunscreen, spf, mens, men, body butter, hand cream, eye cream, lip');
        const stageMin = { cold_start: 30000, growth: 5000, mature: 1000, decline: 10000 };
        const [minSFR, setMinSFR] = useState(stageMin[stage] || 30000);
        const [maxClickShare, setMaxClickShare] = useState(40);
        useEffect(() => setMinSFR(stageMin[stage] || 30000), [stage]);

        const results = useMemo(() => {
          const excludes = splitWords(irrelevantTerms.toLowerCase());
          const posWords = Object.values(positioning || {}).flatMap((v) => splitWords((v||'').toLowerCase()));
          return keywords.map((k) => {
            const kw = (k.keyword || '').toLowerCase();
            const filtered1 = excludes.some((x) => kw.includes(x));
            const filtered2 = (stage === 'mature' || stage === 'decline') ? false : !(k.sfr >= minSFR);
            const filtered3 = k.clickShare1 ? k.clickShare1 > maxClickShare : false;
            let rel = 2 + Math.min(3, posWords.filter((x)=>kw.includes(x)).length * 0.7);
            let flow = k.sfr ? (k.sfr >= minSFR ? 4 : 2) : 2;
            let comp = k.clickShare1 ? Math.max(1, Math.min(5, 5 - (k.clickShare1 - 10) / 7.5)) : 3;
            let intent = Math.min(5, 2 + (kw.split(' ').length>2?1:0) + (/(buy|best|for|cream|night|anti)/.test(kw)?1.5:0));
            const total = rel*0.3 + flow*0.25 + comp*0.25 + intent*0.2;
            const level = total>=4?'精准/S级':total>=3.5?'A级':total>=3?'词组/B级':'宽泛/C级';
            return { ...k, filtered1, filtered2, filtered3, relevance:+rel.toFixed(2), trafficFit:+flow.toFixed(2), competition:+comp.toFixed(2), intent:+intent.toFixed(2), totalScore:+total.toFixed(2), level };
          }).filter(k => !k.filtered1 && !k.filtered2 && !k.filtered3).sort((a,b)=>b.totalScore-a.totalScore).slice(0,200);
        }, [keywords, irrelevantTerms, minSFR, maxClickShare, stage, positioning]);

        const exportCSV = () => {
          const header = ['关键词','SFR排名','搜索量','CPC','点击份额Top1','转化份额Top1','综合评分','相关性','流量适配','竞争可行性','购买意图','推荐匹配方式','优先级'];
          const rows = results.map(r=>[r.keyword,r.sfr||0,r.searchVolume||0,r.cpc||0,r.clickShare1||0,r.convShare1||0,r.totalScore,r.relevance,r.trafficFit,r.competition,r.intent,r.level,r.level.includes('S')?'S':r.level.includes('A')?'A':r.level.includes('B')?'B':'C']);
          const csv = '\uFEFF' + [header, ...rows].map(r=>r.join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob); const a = document.createElement('a');
          a.href = url; a.download = '广告投放词筛选结果.csv'; a.click(); URL.revokeObjectURL(url);
        };

        if (view === 'config') return <div className="space-y-3 fade-in">
          <textarea className="w-full h-24 border border-slate-200 rounded-xl p-3" value={irrelevantTerms} onChange={(e)=>setIrrelevantTerms(e.target.value)} />
          <div className="grid grid-cols-1 md:grid-cols-2 gap-2"><input className="border border-slate-200 rounded-xl p-3" type="number" value={minSFR} onChange={(e)=>setMinSFR(Number(e.target.value))} /><input className="border border-slate-200 rounded-xl p-3" type="number" value={maxClickShare} onChange={(e)=>setMaxClickShare(Number(e.target.value))} /></div>
          <button className="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 text-white" onClick={()=>setView('result')}>开始筛选</button>
        </div>;

        const stat = { S:0,A:0,B:0,C:0 }; results.forEach(r=>{ if(r.level.includes('S'))stat.S++; else if(r.level.includes('A'))stat.A++; else if(r.level.includes('B'))stat.B++; else stat.C++;});
        return <div className="space-y-3 fade-in">
          <div className="rounded-xl overflow-hidden border border-slate-200 max-h-80 overflow-y-auto"><table className="w-full text-sm"><thead className="sticky top-0 bg-slate-50"><tr><th>关键词</th><th>评分</th><th>等级</th></tr></thead><tbody>{results.map((r,i)=><tr key={i} className="border-t"><td>{r.keyword}</td><td>{r.totalScore}</td><td>{r.level}</td></tr>)}</tbody></table></div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">{Object.entries(stat).map(([k,v])=><div key={k} className="rounded-xl border border-slate-200 p-2">{k}: {v}</div>)}</div>
          <div className="flex gap-2"><button className="px-3 py-2 rounded-xl border border-slate-200" onClick={()=>setView('config')}>重新配置</button><button className="px-3 py-2 rounded-xl bg-emerald-600 text-white" onClick={exportCSV}>导出 CSV</button></div>
        </div>
      }

      function App() {
        const [step, setStep] = useState(0);
        const [productData, setProductData] = useState(null);
        const [reviewInsights, setReviewInsights] = useState(null);
        const [positioning, setPositioning] = useState({ categoryWords:'', sellingPoints:'', targetAudience:'', useScenarios:'' });
        const [stage, setStage] = useState('cold_start');
        const [keywords, setKeywords] = useState([]);

        const content = [
          <ProductAnalysis productData={productData} setProductData={setProductData} setPositioning={setPositioning} setKeywords={setKeywords} />,
          <CompetitorReviews setReviewInsights={setReviewInsights} reviewInsights={reviewInsights} />,
          <ProductPositioning productData={productData} positioning={positioning} setPositioning={setPositioning} stage={stage} setStage={setStage} reviewInsights={reviewInsights} />,
          <KeywordImport keywords={keywords} setKeywords={setKeywords} reviewInsights={reviewInsights} />,
          <ABAMatching keywords={keywords} setKeywords={setKeywords} />,
          <FunnelFilter keywords={keywords} positioning={positioning} stage={stage} reviewInsights={reviewInsights} />,
        ][step];

        return <div className="max-w-5xl mx-auto px-4 pb-8">
          <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/70 py-3 mb-4">
            <div className="flex items-center gap-3"><div className="w-9 h-9 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600"></div><h1 className="font-bold">广告投放词筛选</h1></div>
            <Stepper step={step} />
          </nav>
          <section className="bg-white rounded-2xl shadow-sm border border-slate-200/60 hover:shadow-md transition p-5 space-y-4">
            {content}
            <div className="flex justify-between pt-2">
              <button className="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl disabled:opacity-40" disabled={step===0} onClick={()=>setStep((s)=>Math.max(0,s-1))}>上一步</button>
              <button className="px-4 py-2 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl disabled:opacity-40" disabled={step===5} onClick={()=>setStep((s)=>Math.min(5,s+1))}>下一步</button>
            </div>
          </section>
        </div>;
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
